schema_version: 1

object_types:
  cafe_chair:
    visual_preset: cafe_chair_wood
    slots:
      - kind: sit
        capacity: 1
    affordances:
      - action: sit
        executor: occupy_slot
        duration_seconds: [2, 4]
        interruptible: true
        slot_kind: sit

  coffee_counter:
    visual_preset: coffee_counter_wood
    slots:
      - kind: service
        capacity: 1
      - kind: queue
        capacity: 1
    affordances:
      - action: order_coffee
        executor: service_queue
        duration_seconds: [45, 75]
        interruptible: true
        slot_kind: service
