default_stages: [pre-commit]

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: debug-statements

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.13
    hooks:
      - id: ruff
        files: ^backend/
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        files: ^backend/

  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.10
    hooks:
      - id: actionlint
        args: [-shellcheck=]

  - repo: local
    hooks:
      - id: backend-ruff-check
        name: backend-ruff-check
        entry: make backend-lint
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: backend-ruff-format-check
        name: backend-ruff-format-check
        entry: make backend-format-check
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: backend-mypy
        name: backend-mypy
        entry: make backend-typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: backend-pytest
        name: backend-pytest
        entry: make backend-test-ci
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-eslint
        name: frontend-eslint
        entry: make frontend-eslint
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-types
        name: frontend-types
        entry: make frontend-typecheck
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-jest
        name: frontend-jest
        entry: make frontend-test
        language: system
        pass_filenames: false
        stages: [pre-push]
      - id: frontend-build
        name: frontend-build
        entry: make frontend-build
        language: system
        pass_filenames: false
        stages: [pre-push]
